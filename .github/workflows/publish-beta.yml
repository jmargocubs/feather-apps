name: Publish Beta
run-name: ${{ inputs.operation }} ${{ inputs.app }} ${{ inputs.version }} ${{ inputs.build }} ${{ inputs.artifact_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "stage, validate, or publish"
        required: true
        type: choice
        options: [stage, validate, publish]
      app:
        description: "kyro (Kyro X iOS), kyro-tvos (Kyro X tvOS), zepzi, or sunnymeadow"
        required: true
        type: choice
        options: [kyro, kyro-tvos, zepzi, sunnymeadow]
      version: { description: "app version (validate/publish)", required: false }
      build: { description: "app build (validate/publish)", required: false }
      release_notes: { description: "release notes (publish)", required: false }
      artifact_run_id: { description: "staging workflow run ID (validate/publish)", required: false }
      artifact_name: { description: "exact Actions artifact name", required: true }
      expected_sha256: { description: "expected IPA SHA-256", required: true }
      expected_size: { description: "expected IPA size in bytes", required: true }
      staging_locator: { description: "draft release_id:asset_id (stage only)", required: false }
      publish_approved:
        description: "Approved for distribution (required for publish; otherwise nothing is released)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-beta-${{ inputs.operation }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  stage:
    if: inputs.operation == 'stage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Validate staging request
        env:
          APP: ${{ inputs.app }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
          LOCATOR: ${{ inputs.staging_locator }}
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^(kyro|kyro-tvos|zepzi|sunnymeadow)$ ]]
          [[ "$ARTIFACT_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIZE" =~ ^[0-9]+$ ]]
          [[ "$LOCATOR" =~ ^[0-9]+:[0-9]+$ ]]

      - name: Download authenticated draft asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          APP: ${{ inputs.app }}
          LOCATOR: ${{ inputs.staging_locator }}
        run: |
          set -euo pipefail
          RELEASE_ID="${LOCATOR%%:*}"
          ASSET_ID="${LOCATOR##*:}"
          gh api "repos/$REPOSITORY/releases/$RELEASE_ID" > /tmp/staging-release.json
          jq -e --argjson asset_id "$ASSET_ID" '
            .draft == true and
            any(.assets[]; .id == $asset_id and .state == "uploaded" and (.name | endswith(".ipa")))
          ' /tmp/staging-release.json >/dev/null
          mkdir -p /tmp/stage
          gh api "repos/$REPOSITORY/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" > "/tmp/stage/$APP.ipa"

      - name: Verify staged bytes
        env:
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          test "$(find /tmp/stage -type f -name '*.ipa' | wc -l | tr -d ' ')" -eq 1
          python - <<'PY'
          import glob, hashlib, os
          paths = glob.glob('/tmp/stage/*.ipa')
          assert len(paths) == 1, f"expected one IPA, found {len(paths)}"
          path = paths[0]
          digest = hashlib.sha256(open(path, 'rb').read()).hexdigest()
          size = os.path.getsize(path)
          assert digest == os.environ['SHA'], f"SHA-256 mismatch: {digest}"
          assert str(size) == os.environ['SIZE'], f"size mismatch: {size}"
          print(f"verified {path}: sha256={digest} size={size}")
          PY

      - name: Upload immutable Actions artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/stage/*.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove temporary draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          LOCATOR: ${{ inputs.staging_locator }}
        run: |
          set -euo pipefail
          RELEASE_ID="${LOCATOR%%:*}"
          gh api --method DELETE "repos/$REPOSITORY/releases/$RELEASE_ID"

  validate:
    if: inputs.operation == 'validate' || inputs.operation == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: { python-version: "3.11" }
      - name: Validate inputs
        env:
          OPERATION: ${{ inputs.operation }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          NOTES: ${{ inputs.release_notes }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
          APPROVED: ${{ inputs.publish_approved }}
        run: |
          set -euo pipefail
          [[ "$APP" =~ ^(kyro|kyro-tvos|zepzi|sunnymeadow)$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          [[ "$BUILD" =~ ^[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIZE" =~ ^[0-9]+$ ]]
          # Same per-app version policy as local publishing (apps.py assert_version_policy).
          python scripts/apps.py check-version "$APP" "$VERSION" "$BUILD"
          if [[ "$OPERATION" == publish ]]; then
            if [[ "$APPROVED" != true ]]; then
              echo "publish requires publish_approved=true (build approved for distribution)" >&2
              exit 1
            fi
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "publish is restricted to refs/heads/main (got $GITHUB_REF)" >&2
              exit 1
            fi
          fi
      - name: Download staged artifact from the named run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stage
      - name: Ensure exactly one IPA
        run: |
          set -euo pipefail
          test "$(find /tmp/stage -type f -name '*.ipa' | wc -l | tr -d ' ')" -eq 1
          IPA_PATH="$(find /tmp/stage -type f -name '*.ipa' -print -quit)"
          printf 'IPA_PATH=%s\n' "$IPA_PATH" >> "$GITHUB_ENV"
      - name: Resolve app metadata
        id: appmeta
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          echo "bundle=$(python scripts/apps.py bundle "$APP")" >> "$GITHUB_OUTPUT"
          echo "minos=$(python scripts/apps.py minos "$APP")" >> "$GITHUB_OUTPUT"
      - name: Validate IPA metadata
        env:
          BUNDLE: ${{ steps.appmeta.outputs.bundle }}
          MINOS: ${{ steps.appmeta.outputs.minos }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: python scripts/validate_ipa.py "$IPA_PATH" --bundle "$BUNDLE" --version "$VERSION" --build "$BUILD" --minos "$MINOS"
      - name: Security scan
        run: python scripts/scan_ipa.py "$IPA_PATH"
      - name: Verify checksum and size
        env:
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
        run: python scripts/verify_file.py "$IPA_PATH" --sha256 "$SHA" --size "$SIZE"
      - name: Confirm repository access
        if: inputs.operation == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: test "$(gh api "repos/$REPOSITORY" --jq .full_name)" = "$REPOSITORY"

  publish:
    if: inputs.operation == 'publish' && inputs.publish_approved && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: { python-version: "3.11" }
      - name: Download staged artifact from the named run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stage
      - name: Resolve app metadata
        id: appmeta
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          echo "bundle=$(python scripts/apps.py bundle "$APP")" >> "$GITHUB_OUTPUT"
          echo "minos=$(python scripts/apps.py minos "$APP")" >> "$GITHUB_OUTPUT"
      - name: Revalidate exactly one IPA, metadata, checksum, and size
        env:
          BUNDLE: ${{ steps.appmeta.outputs.bundle }}
          MINOS: ${{ steps.appmeta.outputs.minos }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          test "$(find /tmp/stage -type f -name '*.ipa' | wc -l | tr -d ' ')" -eq 1
          IPA_PATH="$(find /tmp/stage -type f -name '*.ipa' -print -quit)"
          python scripts/validate_ipa.py "$IPA_PATH" --bundle "$BUNDLE" --version "$VERSION" --build "$BUILD" --minos "$MINOS"
          python scripts/scan_ipa.py "$IPA_PATH"
          python scripts/verify_file.py "$IPA_PATH" --sha256 "$SHA" --size "$SIZE"
          printf 'IPA_PATH=%s\n' "$IPA_PATH" >> "$GITHUB_ENV"
      - name: Publish with the shared publisher (same code path as local Mac publishing)
        env:
          # Kyro IPAs are released in jmargocubs/Kyro, which this repository's GITHUB_TOKEN
          # cannot write; add a KYRO_PUBLISH_TOKEN secret (contents:write on Kyro) for those.
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KYRO_TOKEN: ${{ secrets.KYRO_PUBLISH_TOKEN }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          case "$APP" in
            kyro|kyro-tvos) export GH_TOKEN="${KYRO_TOKEN:-}" ;;
            *) export GH_TOKEN="$REPO_TOKEN" ;;
          esac
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::$APP releases live in jmargocubs/Kyro; add the KYRO_PUBLISH_TOKEN secret to publish them from here (or use the Kyro cloud build with publish_approved, or local publish_ipa.py)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/publish_ipa.py "$IPA_PATH" --app "$APP" --version "$VERSION" \
            --build "$BUILD" --notes "$NOTES" --approved

  # Catalog commits pushed with GITHUB_TOKEN do not trigger push workflows, so deploy
  # Pages explicitly after a successful publish.
  deploy-pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
