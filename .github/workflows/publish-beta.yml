name: Publish Beta
on:
  workflow_dispatch:
    inputs:
      app: { description: "kyro or zepzi", required: true, type: choice, options: [kyro, zepzi] }
      version: { description: "version", required: true }
      build: { description: "build", required: true }
      release_notes: { description: "release notes", required: true }
      artifact_run_id: { description: "workflow run ID containing the staged IPA artifact", required: true }
      artifact_name: { description: "exact artifact name", required: true }
      expected_sha256: { description: "expected sha256", required: true }
      expected_size: { description: "expected size bytes", required: true }
permissions:
  contents: read
concurrency:
  group: publish-beta
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: { python-version: "3.11" }
      - name: Validate inputs
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
        run: |
          set -euo pipefail
          echo "$APP" | grep -Eq '^(kyro|zepzi)$'
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'
          echo "$BUILD" | grep -Eq '^[0-9]+$'
          echo "$SHA" | grep -Eq '^[0-9a-f]{64}$'
          echo "$SIZE" | grep -Eq '^[0-9]+$'
      - name: Download staged artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stage
      - name: Ensure single IPA
        run: |
          set -euo pipefail
          test "$(find /tmp/stage -name '*.ipa' | wc -l)" -eq 1
      - name: Validate IPA
        env:
          BUNDLE: ${{ inputs.app == 'kyro' && 'com.cubbiestream.kyro' || 'app.flippy.reader' }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: python scripts/validate_ipa.py /tmp/stage/*.ipa --bundle "$BUNDLE" --version "$VERSION" --build "$BUILD" --minos 18.0
      - name: Security scan
        run: python scripts/scan_ipa.py /tmp/stage/*.ipa
      - name: Verify checksum and size
        env:
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
        run: |
          python - << 'PY'
          import hashlib, os, glob
          ipa=glob.glob('/tmp/stage/*.ipa')[0]
          sha=hashlib.sha256(open(ipa,'rb').read()).hexdigest()
          size=os.path.getsize(ipa)
          assert sha==os.environ['SHA'], f"sha mismatch {sha}"
          assert str(size)==os.environ['SIZE'], f"size mismatch {size}"
          print("verified", sha, size)
          PY
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: release-approval
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: { python-version: "3.11" }
      - name: Download staged artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/stage
      - name: Reverify checksum and size
        env:
          SHA: ${{ inputs.expected_sha256 }}
          SIZE: ${{ inputs.expected_size }}
        run: |
          python - << 'PY'
          import hashlib, os, glob
          ipa=glob.glob('/tmp/stage/*.ipa')[0]
          sha=hashlib.sha256(open(ipa,'rb').read()).hexdigest()
          size=os.path.getsize(ipa)
          assert sha==os.environ['SHA']
          assert str(size)==os.environ['SIZE']
          print("reverified", sha, size)
          PY
      - name: Check duplicate tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          TAG="${APP}-v${VERSION}-b${BUILD}"
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "duplicate tag $TAG"; exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="${APP}-v${VERSION}-b${BUILD}"
          ASSET="/tmp/stage/$(ls /tmp/stage/*.ipa | xargs -n1 basename)"
          gh release create "$TAG" "$ASSET" --repo ${{ github.repository }} --title "${APP} ${VERSION} (Build ${BUILD}) Beta" --notes "$NOTES"
      - name: Update source.json via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
          SIZE: ${{ inputs.expected_size }}
          TAG: ${{ inputs.app }}-v${{ inputs.version }}-b${{ inputs.build }}
        run: |
          set -euo pipefail
          ASSET="$(ls /tmp/stage/*.ipa | xargs -n1 basename)"
          python scripts/update_source.py --app "$APP" --version "$VERSION" --build "$BUILD" --size "$SIZE" --tag "$TAG" --asset "$ASSET"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          BRANCH="source-update-${APP}-${VERSION}-b${BUILD}"
          git checkout -b "$BRANCH"
          git add source.json
          git commit -m "Update source for $APP $VERSION build $BUILD"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Source update: $APP $VERSION build $BUILD" --body "Automated source update after approved release."
      - name: Awaiting source-update PR merge
        run: echo "Source-update PR created. Merge it to trigger Pages deployment and live verification."
