name: Test PR Token
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  test-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify GITHUB_TOKEN PR creation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="test-pr-token-verify"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "Test run at $(date -u)" > test_pr_verification.txt
          git add test_pr_verification.txt
          git commit -m "Test verification for GITHUB_TOKEN PR creation"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "[TEST] Verify GITHUB_TOKEN PR creation" \
            --body "Temporary test verifying GITHUB_TOKEN PR creation capabilities.")
          echo "PR created: $PR_URL"
          PR_NUM=$(gh pr view "$PR_URL" --json number --jq .number)
          gh pr close "$PR_NUM" --repo "$GITHUB_REPOSITORY" --delete-branch
          echo "Test PR #$PR_NUM closed and branch deleted successfully."
