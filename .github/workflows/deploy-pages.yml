name: Deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@983d7736d9b0ae728b8108732fe4c690d97cc09e
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e574736d1d65fa9c
        with: { path: "." }
      - uses: actions/deploy-pages@d65d3494d20208497995b339078e3772e375a917
      - name: Verify live source matches committed source
        run: |
          python - << 'PY'
          import json, urllib.request
          local=json.load(open('source.json'))
          live=json.load(urllib.request.urlopen('https://jmargocubs.github.io/feather-apps/source.json'))
          assert local==live, "live source differs from committed source"
          print("live source matches committed source")
          PY

